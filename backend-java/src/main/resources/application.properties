# LegalMetriScan Spring Boot Configuration
server.port=${PORT:4000}
spring.application.name=legalmetriscan-backend

# Socket.IO Real-Time Pairing Configuration
socket.server.host=0.0.0.0
socket.server.port=${SOCKET_PORT:4001}
vite.port=${VITE_PORT:5173}

# High Payload Capacities for Smartphone Optical Camera Uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB

# Logging Configuration
logging.level.com.sih.legalmetriscan=INFO
logging.level.com.corundumstudio.socketio=WARN
